name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version and verification key
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("fs"); const p = require("./package.json"); const l = require("./package-lock.json"); if (process.env.RELEASE_TAG !== "v" + p.version || l.version !== p.version) throw Error("Tag, package and lockfile versions must match"); if (!fs.existsSync("resources/update-public-key.pem")) throw Error("Configure the Fidra release verification key first")'
      - name: Install dependencies
        run: npm ci
      - name: Check types and run tests
        run: |
          npx tsc --noEmit
          npm test
      - name: Build and verify matching connection helper
        shell: bash
        run: |
          export FIDRA_PLUGIN_NODE_RUNTIME="$(node -p 'process.execPath')"
          npm run build:ai-plugin
          node scripts/smoke-ai-plugin.mjs
      - name: Desktop acceptance on the isolated runner
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          npm run rebuild:electron
          npm run package -- --arch="$TARGET_ARCH"
          export FIDRA_E2E_PLUGIN_ROOT="$PWD/out/ai-plugin/$TARGET_PLATFORM-$TARGET_ARCH/Fidra-private/Fidra"
          if [ "$TARGET_PLATFORM" = darwin ]; then
            export FIDRA_E2E_PACKAGED_EXECUTABLE="$PWD/out/Fidra-darwin-arm64/Fidra.app/Contents/MacOS/Fidra"
            npx playwright test
          else
            export FIDRA_E2E_PACKAGED_EXECUTABLE="$PWD/out/Fidra-win32-x64/Fidra.exe"
            npx playwright test e2e/packaged-fidra.e2e.ts e2e/installed-helper.e2e.ts
          fi
          npm run rebuild:node
      - name: Prepare update signing key
        shell: bash
        env:
          UPDATE_KEY_B64: ${{ secrets.FIDRA_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          node -e 'const fs = require("fs"); const path = require("path"); const crypto = require("crypto"); if (!process.env.UPDATE_KEY_B64) throw Error("Set FIDRA_UPDATE_PRIVATE_KEY_B64 before releasing"); const key = crypto.createPrivateKey(Buffer.from(process.env.UPDATE_KEY_B64, "base64")); if (!crypto.createPublicKey(key).equals(crypto.createPublicKey(fs.readFileSync("resources/update-public-key.pem")))) throw Error("Release signing key does not match the embedded public key"); const file = path.join(process.env.RUNNER_TEMP, "fidra-update-private.pem"); fs.writeFileSync(file, key.export({type:"pkcs8", format:"pem"}), {mode:0o600}); fs.appendFileSync(process.env.GITHUB_ENV, "FIDRA_UPDATE_PRIVATE_KEY_PATH=" + file + "\n")'
      - name: Build installers and signed update metadata into a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-forge publish --arch=${{ matrix.arch }}
      - name: Smoke-test actual previous-version installer replacement
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/candidate"
          if [ "$TARGET_PLATFORM" = darwin ]; then asset=Fidra-macOS-arm64.dmg; else asset=Fidra-Windows-Setup.exe; fi
          gh release download v0.1.23 --pattern "$asset" --dir "$RUNNER_TEMP/previous"
          gh release download "$RELEASE_TAG" --pattern "$asset" --pattern "fidra-update-$TARGET_PLATFORM-$TARGET_ARCH.json" --dir "$RUNNER_TEMP/candidate"
          node scripts/smoke-installer-upgrade.mjs "$RUNNER_TEMP/previous/$asset" "$RUNNER_TEMP/candidate/$asset" "$RUNNER_TEMP/candidate/fidra-update-$TARGET_PLATFORM-$TARGET_ARCH.json" "out/ai-plugin/$TARGET_PLATFORM-$TARGET_ARCH/Fidra-private/Fidra"
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: node -e 'require("fs").rmSync(require("path").join(process.env.RUNNER_TEMP, "fidra-update-private.pem"), {force:true})'

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify all update artifacts and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          node -e 'const names = new Set(require("./release-assets.json").assets.map(a => a.name)); for (const name of ["Fidra-macOS-arm64.dmg", "Fidra-Windows-Setup.exe", "fidra-update-darwin-arm64.json", "fidra-update-win32-x64.json"]) if (!names.has(name)) throw Error("Missing release asset: " + name)'
          gh release edit "$RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md" --draft=false
